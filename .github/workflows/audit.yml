name: Audit

# OpenSSL, SQLite and libssh2 are statically vendored into the darn binary.
# That means a distro updating its own openssl package does nothing for darn —
# an advisory against openssl-src can only be fixed by rebuilding and
# re-releasing darn. Treat a vulnerability here as a release trigger.
#
# Policy: vulnerabilities fail the job; informational advisories (unmaintained,
# unsound, yanked, notice) are reported in the log but do not fail, since they
# usually sit in transitive dependencies that cannot be fixed on our schedule.
# That is cargo-audit's default behaviour — it prints "N allowed warnings found"
# and exits 0. To make a specific class fatal later, add e.g. `--deny unmaintained`.
#
# This calls cargo-audit directly rather than using rustsec/audit-check, which
# routes results through a check run (needing checks: write, and failing with
# "Resource not accessible by integration" without it), still declares the
# deprecated node20 runtime, and offers no severity control beyond an
# allowlist of specific advisory ids.

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
