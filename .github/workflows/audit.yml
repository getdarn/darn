name: Audit

# OpenSSL, SQLite and libssh2 are statically vendored into the darn binary.
# That means a distro updating its own openssl package does nothing for darn —
# an advisory against openssl-src (or any other dependency) can only be fixed by
# rebuilding and re-releasing darn. Treat a failure here as a release trigger,
# not just as a lint.
on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  # checks: write is what the Checks API needs to publish the audit result;
  # without it the action fails with "Resource not accessible by integration".
  checks: write
  # issues: write lets the action open an issue for a new advisory on the
  # scheduled run.
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
