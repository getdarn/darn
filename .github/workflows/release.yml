name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # Native packages. Built inside manylinux_2_28 for a glibc 2.28 floor, which
  # covers RHEL/Alma/Rocky 8+, Debian 11+, Ubuntu 20.04+ and Fedora. Building on
  # the bare runner would produce a glibc 2.39 binary that none of the older
  # distros can load.
  build-native:
    needs: verify
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      # manylinux_2_28 is AlmaLinux 8, where perl ships split into subpackages.
      # IPC::Cmd is the one module OpenSSL 3's Configure needs that the image
      # lacks, so without this the vendored openssl-src build dies with
      # "Can't locate IPC/Cmd.pm in @INC" at OpenSSL/config.pm line 19.
      # Time::Piece is the other one. (Text::Template and Test::More are also
      # referenced but need nothing: the former is vendored inside openssl-src,
      # the latter is only for the test suite, which we build with no-tests.)
      # Requested as capabilities rather than package names: RHEL 8 hides
      # modular subpackages from `dnf install <name>` even when they are in the
      # repo metadata, and a capability also no-ops cleanly if a future base
      # image already provides it.
      - name: Install OpenSSL build prerequisites
        run: dnf -y install "perl(IPC::Cmd)" "perl(Time::Piece)"
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-x86_64
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: cargo build --release --locked
      - name: Generate man page and completions
        run: ci/gen-dist.sh /usr/bin/darn dist
      - run: cargo deb --no-build --no-strip
      - run: cargo generate-rpm --auto-req auto
      - uses: actions/upload-artifact@v4
        with:
          name: native-x86_64
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
      # The tarball and the container image need the man page and completions.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-shared
          path: dist/

  # Fully static binaries for the tarballs and the container image.
  build-musl:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-x86_64
      # musl-gcc builds the vendored C dependencies (OpenSSL, SQLite, libssh2,
      # zlib); perl and make are needed by openssl-src and are preinstalled.
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools musl-dev
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - name: Stage and verify static binary
        run: |
          set -eu
          cp target/x86_64-unknown-linux-musl/release/darn darn
          # Must have no program interpreter, or it will not run on a distro
          # with a different libc. Checked at the ELF level rather than by
          # matching ldd's wording: rust musl builds are static-PIE, for which
          # glibc's ldd prints "statically linked", while a non-PIE static
          # binary gives "not a dynamic executable" — so any string match here
          # is fragile and can reject a perfectly good binary.
          if readelf -l darn | grep -q 'Requesting program interpreter'; then
            echo "::error::musl build is dynamically linked"
            readelf -l darn | grep 'Requesting program interpreter'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: musl-amd64
          path: darn

  tarballs:
    needs: [verify, build-musl, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Assemble
        run: |
          set -eu
          v=${{ needs.verify.outputs.version }}
          name="darn-$v-x86_64-linux-musl"
          mkdir -p "$name/completions"
          install -m755 artifacts/musl-amd64/darn "$name/darn"
          cp README.md LICENSE.txt "$name/"
          cp artifacts/dist-shared/darn.1 "$name/"
          # PATH-resolved variant: a tarball can be unpacked anywhere, so the
          # packaged /usr/bin/darn path would be wrong.
          cp artifacts/dist-shared/completions-portable/* "$name/completions/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: '*.tar.gz'

  release:
    needs: [verify, build-native, build-musl, tarballs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect
        run: |
          set -eu
          mkdir -p release
          find artifacts \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          # Fail here rather than letting a later step report a confusing
          # "could not find subject" against an empty directory.
          count=$(find release -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no artifacts collected; check the build jobs' uploads"
            find artifacts -type f | head -50
            exit 1
          fi
          cd release && sha256sum * > SHA256SUMS
          echo "collected $count artifacts:"; cat SHA256SUMS
      # Meaningful for a tool that runs sudo across a fleet: lets an operator
      # verify a downloaded package really came from this workflow.
      - uses: actions/attest-build-provenance@v2
        with:
          # One path per line: subject-path is expanded by @actions/glob, which
          # does not support brace expansion, so 'release/*.{deb,rpm,tar.gz}'
          # is taken literally and matches nothing. SHA256SUMS is deliberately
          # not attested -- it is a manifest of the attested files.
          subject-path: |
            release/*.deb
            release/*.rpm
            release/*.tar.gz
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "darn ${{ needs.verify.outputs.version }}" \
            --generate-notes \
            ${{ needs.verify.outputs.prerelease == 'true' && '--prerelease' || '' }}

  publish-image:
    needs: [verify, build-musl, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Stage build context
        run: |
          set -eu
          mkdir -p ctx/dist/completions
          install -m755 artifacts/musl-amd64/darn ctx/dist/darn-amd64
          cp artifacts/dist-shared/completions/darn.bash ctx/dist/completions/
          cp Dockerfile ctx/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}
            ${{ needs.verify.outputs.prerelease == 'false' && format('ghcr.io/{0}:latest', github.repository) || '' }}

  publish-repos:
    needs: [verify, release]
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: pipx install cloudsmith-cli
      - name: Push to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          set -eu
          # any-distro/any-version: one package serves every apt (resp. yum)
          # consumer, which works because the glibc floor is 2.28 and the only
          # other dependency is zlib.
          for f in $(find artifacts -name '*.deb'); do
            cloudsmith push deb getdarn/darn/any-distro/any-version "$f"
          done
          for f in $(find artifacts -name '*.rpm'); do
            cloudsmith push rpm getdarn/darn/any-distro/any-version "$f"
          done
